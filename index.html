<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <style>
    .custom-dark {
        background-color: #333333;
    }
    .btn1{
        margin-top: 40%;
    }   
    .bungee-regular {
    font-family: "Bungee", sans-serif;
    font-weight: 400;
    font-style: normal;
    }
    .w-60{
      width: 60%;
    }
    .w-90{
      width: 90%;
    }
    .shadow-light {
      box-shadow: 0px 4px 10px rgba(137, 129, 129, 0.6);
    }
    .h-20{
      height: 20%;
    }
  </style>
  <body>
    <div class="d-flex flex-row">
        <div class="w-25 vh-100 custom-dark d-flex flex-column align-items-center LHS">
            <button class="btn btn1 text-white w-70 mb-3 border border-dark bg-dark shadow rounded-pill bungee-regular fs-5">Home</button>
            <button class="btn text-white w-70 mb-3 border border-dark bg-dark shadow rounded-pill bungee-regular fs-5">Progress</button>
            <button class="btn text-white w-70 border border-dark bg-dark shadow rounded-pill bungee-regular fs-5">Leaderboard</button>
        </div>

        <div class="w-75 vh-100 RHS bg-dark">
          <div class="habits h-75 w-90 mx-auto d-grid" style="grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, auto); gap: 10px;">
            <button class="btn bg-light mt-3 test">Habit info</button>
            <button class="btn bg-light mt-3 test">Habit info</button>
            <button class="btn bg-light mt-3 test">habit info</button>
            <button class="btn bg-light mt-3 test">Habbit info</button>
            <button class="btn bg-light mt-3 test">Habit info</button>
          </div>

          <div class="button-room h-25 d-flex justify-content-center">
            <button class="btn w-60 h-20 mt-3 fs-5 text-white border border-light shadow-light rounded-pill center">Click to add Habits!</button>
          </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
